<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>백자 달항 핀볼</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');
body{margin:0;padding:0;background:#1a1612;color:#f5f0e8;font-family:'Noto Serif KR',serif;display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none}
#ui{position:absolute;top:10px;left:12px;z-index:10;font-size:15px;background:rgba(30,25,20,.75);padding:6px 12px;border-radius:16px;border:1px solid #8a7a60}
#controls{position:absolute;bottom:12px;width:100%;display:flex;justify-content:space-around;z-index:10}
button{background:linear-gradient(145deg,#e8dcc8,#c4b498);color:#2a241c;border:none;padding:14px 26px;font-size:16px;border-radius:12px;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.3)}
button:active{transform:scale(.96)}
#game-over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,16,12,.92);padding:28px;border-radius:16px;text-align:center;display:none;border:1px solid #c4b498}
canvas{border:4px solid #c4b498;border-radius:10px;box-shadow:0 0 20px rgba(196,180,152,.3)}
.title{position:absolute;top:10px;right:14px;font-size:13px;color:#c4b498;letter-spacing:1px}
</style>
</head>
<body>
<div class="title">백자 달항 핀볼</div>
<div id="ui">점수: <span id="score">0</span> &nbsp;|&nbsp; 공: <span id="balls">3</span></div>
<canvas id="canvas"></canvas>
<div id="controls"><button id="left">◀ 왼쪽</button><button id="launch">발사</button><button id="right">오른쪽 ▶</button></div>
<div id="game-over"><h2>게임 오버</h2><p>최종 점수: <span id="final-score">0</span></p><button onclick="location.reload()">다시 시작</button></div>
<script>
const {Engine,Render,Runner,Bodies,Body,Composite,Events,Constraint}=Matter;
const canvas=document.getElementById('canvas');
const width=Math.min(window.innerWidth-20,460);
const height=Math.min(window.innerHeight-130,720);
canvas.width=width;canvas.height=height;
const engine=Engine.create();const world=engine.world;world.gravity.y=1.1;
const render=Render.create({canvas,engine,options:{width,height,wireframes:false,background:'#2a241c'}});
Render.run(render);const runner=Runner.create();Runner.run(runner,engine);
Composite.add(world,[
Bodies.rectangle(width/2,-8,width+30,16,{isStatic:true,render:{fillStyle:'#c4b498'}}),
Bodies.rectangle(width/2,height+8,width+30,16,{isStatic:true,label:'drain',render:{fillStyle:'#5a4a3a'}}),
Bodies.rectangle(-8,height/2,16,height+30,{isStatic:true,render:{fillStyle:'#c4b498'}}),
Bodies.rectangle(width+8,height/2,16,height+30,{isStatic:true,render:{fillStyle:'#c4b498'}})
]);
Composite.add(world,[
Bodies.rectangle(width-16,height*0.58,7,height*0.72,{isStatic:true,render:{fillStyle:'#e8dcc8'}}),
Bodies.rectangle(width-38,height*0.32,7,height*0.38,{isStatic:true,angle:0.18,render:{fillStyle:'#e8dcc8'}})
]);
Composite.add(world,[
Bodies.rectangle(width*0.72,42,width*0.52,9,{isStatic:true,angle:-0.2,render:{fillStyle:'#e8dcc8'}}),
Bodies.rectangle(width*0.35,78,width*0.42,9,{isStatic:true,angle:0.15,render:{fillStyle:'#e8dcc8'}})
]);
Composite.add(world,Bodies.rectangle(18,height*0.4,7,height*0.48,{isStatic:true,angle:0.05,render:{fillStyle:'#e8dcc8'}}));
Composite.add(world,[
Bodies.rectangle(width*0.14,height-95,11,65,{isStatic:true,angle:0.42,render:{fillStyle:'#c4b498'}}),
Bodies.rectangle(width*0.86,height-95,11,65,{isStatic:true,angle:-0.42,render:{fillStyle:'#c4b498'}})
]);
[[width*0.4,155],[width*0.6,155],[width*0.32,215],[width*0.5,195],[width*0.68,215]].forEach(([x,y])=>{
Composite.add(world,Bodies.circle(x,y,17,{isStatic:true,restitution:1.6,label:'bumper',render:{fillStyle:'#f0e6d0',strokeStyle:'#b89a70',lineWidth:2}}));
});
for(let i=0;i<3;i++)Composite.add(world,Bodies.rectangle(width*0.26+i*52,118,6,36,{isStatic:true,render:{fillStyle:'#d4c4a8'}}));
function createFlipper(x,y,isLeft){
const flipper=Bodies.rectangle(x,y,105,16,{density:0.002,restitution:0.6,friction:0.05,label:isLeft?'left':'right',render:{fillStyle:'#f5efe0',strokeStyle:'#c4b498',lineWidth:1.5}});
const pivot=Bodies.circle(isLeft?x-45:x+45,y,5,{isStatic:true,render:{fillStyle:'#c4b498'}});
const c=Constraint.create({bodyA:flipper,pointA:{x:isLeft?-45:45,y:0},bodyB:pivot,length:0,stiffness:1});
Composite.add(world,[flipper,pivot,c]);return flipper;
}
const leftFlipper=createFlipper(width*0.3,height-65,true);
const rightFlipper=createFlipper(width*0.7,height-65,false);
let ball,ballsLeft=3,score=0,launched=false;
function createBall(){
if(ball)Composite.remove(world,ball);
ball=Bodies.circle(width-16,height-110,9,{restitution:0.85,friction:0.005,density:0.001,label:'ball',render:{fillStyle:'#ffffff',strokeStyle:'#e8dcc8',lineWidth:1}});
Composite.add(world,ball);launched=false;
}
createBall();
Composite.add(world,Bodies.rectangle(width-26,height-32,14,45,{isStatic:true,render:{fillStyle:'#c4b498'}}));
function launchBall(){if(!launched&&ballsLeft>0){Body.setVelocity(ball,{x:-0.4,y:-34});launched=true;}}
let leftDown=false,rightDown=false;
function updateFlippers(){
Body.setAngularVelocity(leftFlipper,leftDown?-0.42:0.22);
Body.setAngularVelocity(rightFlipper,rightDown?0.42:-0.22);
}
['left','right'].forEach(id=>{
const el=document.getElementById(id);
el.addEventListener('pointerdown',e=>{e.preventDefault();if(id==='left')leftDown=true;else rightDown=true;});
el.addEventListener('pointerup',e=>{e.preventDefault();if(id==='left')leftDown=false;else rightDown=false;});
el.addEventListener('pointerleave',()=>{if(id==='left')leftDown=false;else rightDown=false;});
el.addEventListener('pointercancel',()=>{if(id==='left')leftDown=false;else rightDown=false;});
});
document.getElementById('launch').addEventListener('pointerdown',e=>{e.preventDefault();launchBall();});
document.addEventListener('keydown',e=>{
if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')leftDown=true;
if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')rightDown=true;
if(e.key===' '){e.preventDefault();launchBall();}
});
document.addEventListener('keyup',e=>{
if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')leftDown=false;
if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')rightDown=false;
});
Events.on(engine,'beforeUpdate',updateFlippers);
Events.on(engine,'collisionStart',e=>{
e.pairs.forEach(p=>{
const l=[p.bodyA.label,p.bodyB.label];
if(l.includes('ball')&&l.includes('bumper')){score+=150;document.getElementById('score').textContent=score;}
if(l.includes('ball')&&l.includes('drain')){
ballsLeft--;document.getElementById('balls').textContent=ballsLeft;
if(ballsLeft<=0){document.getElementById('final-score').textContent=score;document.getElementById('game-over').style.display='block';Runner.stop(runner);}else setTimeout(createBall,500);
}
});
});
window.addEventListener('resize',()=>location.reload());
</script>
</body>
</html>
