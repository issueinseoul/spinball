<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spinball! - 핀볼 게임</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #fff;
    font-family: 'Arial', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    touch-action: none;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    font-size: 18px;
  }
  #controls {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-around;
    z-index: 10;
  }
  button {
    background: #8B1E1E;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
  }
  button:active { background: #ff4444; }
  #game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    display: none;
  }
  canvas { border: 2px solid #8B1E1E; }
</style>
</head>
<body>
<div id="ui">
  점수: <span id="score">0</span> | 공: <span id="balls">3</span>
</div>
<canvas id="canvas"></canvas>
<div id="controls">
  <button id="left">◀ 왼쪽</button>
  <button id="launch">발사!</button>
  <button id="right">오른쪽 ▶</button>
</div>
<div id="game-over">
  <h2>게임 오버!</h2>
  <p>최종 점수: <span id="final-score">0</span></p>
  <button onclick="location.reload()">다시 시작</button>
</div>

<script>
const { Engine, Render, Runner, Bodies, Body, Composite, Events, Constraint } = Matter;

const canvas = document.getElementById('canvas');
const width = Math.min(window.innerWidth - 20, 500);
const height = Math.min(window.innerHeight - 120, 800);
canvas.width = width;
canvas.height = height;

const engine = Engine.create();
const world = engine.world;
world.gravity.y = 1.2;

const render = Render.create({
  canvas: canvas,
  engine: engine,
  options: {
    width: width,
    height: height,
    wireframes: false,
    background: '#1a1a2e',
    showVelocity: false
  }
});

Render.run(render);
const runner = Runner.create();
Runner.run(runner, engine);

// Walls
const walls = [
  Bodies.rectangle(width/2, -10, width, 20, { isStatic: true, render: { fillStyle: '#8B1E1E' } }),
  Bodies.rectangle(width/2, height+10, width, 20, { isStatic: true, label: 'drain', render: { fillStyle: '#333' } }),
  Bodies.rectangle(-10, height/2, 20, height, { isStatic: true, render: { fillStyle: '#8B1E1E' } }),
  Bodies.rectangle(width+10, height/2, 20, height, { isStatic: true, render: { fillStyle: '#8B1E1E' } })
];
Composite.add(world, walls);

// Bumpers
const bumpers = [];
for (let i = 0; i < 8; i++) {
  const x = 80 + (i % 4) * 100;
  const y = 150 + Math.floor(i / 4) * 180;
  const bumper = Bodies.circle(x, y, 25, {
    isStatic: true,
    restitution: 1.5,
    label: 'bumper',
    render: { fillStyle: '#ffd700' }
  });
  bumpers.push(bumper);
}
Composite.add(world, bumpers);

// Flippers
function createFlipper(x, y, isLeft) {
  const flipper = Bodies.rectangle(x, y, 120, 20, {
    density: 0.002,
    restitution: 0.5,
    friction: 0.1,
    label: isLeft ? 'left' : 'right',
    render: { fillStyle: '#ff6b6b' }
  });
  const pivot = Bodies.circle(isLeft ? x - 50 : x + 50, y, 5, { isStatic: true });
  const constraint = Constraint.create({
    bodyA: flipper,
    pointA: { x: isLeft ? -50 : 50, y: 0 },
    bodyB: pivot,
    length: 0,
    stiffness: 1
  });
  Composite.add(world, [flipper, pivot, constraint]);
  return flipper;
}

const leftFlipper = createFlipper(width * 0.3, height - 80, true);
const rightFlipper = createFlipper(width * 0.7, height - 80, false);

// Ball
let ball;
let ballsLeft = 3;
let score = 0;
let launched = false;

function createBall() {
  if (ball) Composite.remove(world, ball);
  ball = Bodies.circle(width - 40, height - 150, 12, {
    restitution: 0.8,
    friction: 0.01,
    density: 0.001,
    label: 'ball',
    render: { fillStyle: '#fff' }
  });
  Composite.add(world, ball);
  launched = false;
}

createBall();

// Launch plunger
const plunger = Bodies.rectangle(width - 30, height - 40, 20, 60, {
  isStatic: true,
  render: { fillStyle: '#aaa' }
});
Composite.add(world, plunger);

function launchBall() {
  if (!launched && ballsLeft > 0) {
    Body.setVelocity(ball, { x: 0, y: -25 });
    launched = true;
  }
}

// Controls
let leftDown = false, rightDown = false;

function updateFlippers() {
  if (leftDown) {
    Body.setAngularVelocity(leftFlipper, -0.4);
  } else {
    Body.setAngularVelocity(leftFlipper, 0.2);
  }
  if (rightDown) {
    Body.setAngularVelocity(rightFlipper, 0.4);
  } else {
    Body.setAngularVelocity(rightFlipper, -0.2);
  }
}

document.getElementById('left').addEventListener('pointerdown', () => leftDown = true);
document.getElementById('left').addEventListener('pointerup', () => leftDown = false);
document.getElementById('right').addEventListener('pointerdown', () => rightDown = true);
document.getElementById('right').addEventListener('pointerup', () => rightDown = false);
document.getElementById('launch').addEventListener('click', launchBall);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') leftDown = true;
  if (e.key === 'ArrowRight' || e.key === 'd') rightDown = true;
  if (e.key === ' ') launchBall();
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') leftDown = false;
  if (e.key === 'ArrowRight' || e.key === 'd') rightDown = false;
});

// Game loop updates
Events.on(engine, 'beforeUpdate', updateFlippers);

Events.on(engine, 'collisionStart', (event) => {
  event.pairs.forEach(pair => {
    const labels = [pair.bodyA.label, pair.bodyB.label];
    if (labels.includes('ball') && labels.includes('bumper')) {
      score += 100;
      document.getElementById('score').textContent = score;
      const bumper = pair.bodyA.label === 'bumper' ? pair.bodyA : pair.bodyB;
      bumper.render.fillStyle = '#fff';
      setTimeout(() => bumper.render.fillStyle = '#ffd700', 150);
    }
    if (labels.includes('ball') && labels.includes('drain')) {
      ballsLeft--;
      document.getElementById('balls').textContent = ballsLeft;
      if (ballsLeft <= 0) {
        document.getElementById('final-score').textContent = score;
        document.getElementById('game-over').style.display = 'block';
        Runner.stop(runner);
      } else {
        setTimeout(createBall, 500);
      }
    }
  });
});

// Resize handling
window.addEventListener('resize', () => location.reload());
</script>
</body>
</html>
